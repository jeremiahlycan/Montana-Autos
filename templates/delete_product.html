{% extends "common.html" %}
    {% block title %} Montana Autos {% endblock title %}
    {% load static %}
    {% block content %}
    {% load humanize %}

    <div class="container col-md-6 text-center mt-5">
        <h4 class="text-danger">Delete "{{ product.title }}"?</h4>
        
        <p class="text-muted">This action cannot be undone.</p>

        <form method="POST">
            {% csrf_token %}
            <button class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'get-cars' product.id %}"
            class="btn btn-secondary">Cancel</a>
        </form>
    </div>


    {% endblock content %}
