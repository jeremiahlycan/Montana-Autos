{% extends "common.html" %}
    {% block title %} Montana Autos {% endblock title %}
    {% load static %}
    {% block content %}
    {% load humanize %}
    {% load crispy_forms_tags %}

    <div class="container col-md4 my-4 shadow-sm p-3 border">
        <h4 class="text-center">{{title}}</h4>
        <form method="POST" enctype="multipart/form-data"> 
            {% csrf_token %}
            {{form|crispy}}
            <button class="btn btn-sm btn-dark">Submit</button>
        </form>
    </div>

    {% endblock content %}
